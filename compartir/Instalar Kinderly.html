<!doctype html>

<title>Instalar Kinderly</title>
<!-- Archivo para compartir: al abrirlo lleva a la página de instalación de Kinderly. -->
<meta http-equiv="refresh" content="1;url=https://francosiderides-boop.github.io/Kinderly/instalar.html">
<style>
:root{--bg:#fff;--ink:#30353F;--mute:#737985;--btn:#5468A3}
@media (prefers-color-scheme:dark){:root{--bg:#232832;--ink:#F1EEE7;--mute:#B0B5C0;--btn:#B1BEE0}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 "Instrument Sans",system-ui,-apple-system,"Segoe UI",sans-serif}
main{min-height:100vh;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;max-width:420px;margin:0 auto;padding:32px 24px}
svg{width:84px;height:84px;margin-bottom:22px;border-radius:20px;box-shadow:0 10px 30px rgba(62,82,135,.25)}
h1{font:600 1.9rem/1.15 Georgia,"Iowan Old Style",serif;margin:0 0 8px}
p{color:var(--mute);margin:0 0 26px}
a.btn{display:block;width:100%;padding:16px;border-radius:999px;background:var(--btn);color:#fff;font-weight:600;text-decoration:none}
@media (prefers-color-scheme:dark){a.btn{color:#1D2340}}
small{display:block;margin-top:16px;color:var(--mute)}
</style>
</head>
<body>
<main>
  <svg viewBox="0 0 64 64" aria-hidden="true"><rect width="64" height="64" rx="14" fill="#3E5287"/><defs><clipPath id="kc"><rect x="0" y="15" width="64" height="35"/></clipPath></defs><g transform="translate(2.2 0)"><path d="M20 0h8.4v50l-4.2-4.8L20 50z" fill="#F4F1E8"/><g clip-path="url(#kc)" stroke="#F4F1E8" stroke-width="7.6" fill="none"><path d="M25 34.5 46.5 11"/><path d="M25 33 47 56"/></g></g></svg>
  <h1>Kinderly</h1>
  <p>Libros en español, gratis y legales. Te llevamos a instalarla en tu compu o en tu celular…</p>
  <a class="btn" href="https://francosiderides-boop.github.io/Kinderly/instalar.html">Instalar Kinderly</a>
  <small>Funciona con Chrome o Edge en la compu, Safari en Mac, y cualquier celular.</small>
</main>
<script>setTimeout(function(){location.replace('https://francosiderides-boop.github.io/Kinderly/instalar.html')},600)</script>

</html>
