<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kinderly</title>
<style>
:root{--bg:#f3f1ec;--card:#fff;--ink:#1c2a3a;--mute:#5d6b7a;--line:#d9d6cd;--acc:#1f4e79;--accInk:#fff;--ok:#2d7a4f;--err:#b3382c}
@media(prefers-color-scheme:dark){:root{--bg:#141a21;--card:#1d2630;--ink:#e8ecf0;--mute:#9aa7b4;--line:#2e3a47;--acc:#6fa8dc;--accInk:#10202f;--ok:#6cc596;--err:#ff8a7a}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 system-ui,sans-serif;padding:16px;max-width:640px;margin-inline:auto}
h1{font:700 1.7rem Georgia,serif;margin:4px 0 2px}
.sub{color:var(--mute);margin:0 0 16px;font-size:.92rem}
.row{display:flex;gap:8px;margin-bottom:10px}
input[type=text],input[type=email]{width:100%;padding:12px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);font:inherit}
button{padding:12px 16px;border:0;border-radius:10px;background:var(--acc);color:var(--accInk);font:600 1rem system-ui;cursor:pointer;white-space:nowrap}
button.ghost{background:transparent;color:var(--acc);border:1px solid var(--acc)}
button:disabled{opacity:.5}
:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.item{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin:8px 0}
.top{display:flex;gap:12px;align-items:center;justify-content:space-between}
.det{margin-top:8px;border-top:1px solid var(--line);padding-top:8px;font-size:.92rem}
.det summary{color:var(--acc);font-weight:600}
.det p{margin:6px 0}
.item b{display:block;font-family:Georgia,serif}
.item small{color:var(--mute)}
.tag{display:inline-block;font-size:.75rem;border:1px solid var(--line);border-radius:6px;padding:0 6px;margin:4px 4px 0 0;color:var(--mute)}
#status{position:sticky;bottom:8px;margin-top:12px;padding:12px;border-radius:10px;background:var(--card);border:1px solid var(--line);display:none}
#status.ok{color:var(--ok)}#status.err{color:var(--err)}
details{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 14px;margin:14px 0}
summary{font-weight:600;cursor:pointer}
label{display:block;margin:10px 0 4px;font-size:.9rem;color:var(--mute)}
.src{margin:6px 0 0;font-size:.85rem}.src a{color:var(--acc);margin-right:10px}
#file{display:none}
#cam{position:fixed;inset:0;background:#000;display:none;flex-direction:column;z-index:9}
#cam video{flex:1;min-height:0;width:100%;object-fit:cover}
.frame{position:absolute;inset:8% 10% 22%;border:3px dashed rgba(255,255,255,.8);border-radius:12px;pointer-events:none}
.camBar{display:flex;gap:8px;justify-content:center;padding:14px 14px calc(14px + env(safe-area-inset-bottom,0px));background:#000}
.camBar .ghost{color:#fff;border-color:#fff}
.hint{position:absolute;top:calc(12px + env(safe-area-inset-top,0px));left:0;right:0;text-align:center;color:#fff;font-size:.9rem;text-shadow:0 1px 3px #000}
</style>
</head>
<body>
<h1>Kinderly</h1>
<p class="sub">Epubs legales en español, directo a tu mail. Beta.</p>

<div class="row">
  <input type="text" id="q" placeholder="Título o autor" enterkeyhint="search">
  <button id="go">Buscar</button>
</div>
<div class="row">
  <button class="ghost" id="scan" style="flex:1">Escanear tapa con la cámara</button>
  <button class="ghost" id="gal0">Galería</button>
</div>
<input type="file" id="file" accept="image/*">

<div id="res"></div>
<div class="src" id="ext"></div>
<div id="status" role="status"></div>

<details id="cfg">
  <summary>Mi mail</summary>
  <label for="mail">Mail donde recibís los libros (o tu Kindle: usuario@kindle.com)</label>
  <input type="email" id="mail" placeholder="vos@gmail.com" autocomplete="email">
  <div class="row" style="margin-top:12px"><button id="save">Guardar</button></div>
  <p class="sub">Si usás Kindle, aprobá el mail remitente en Amazon (Contenido y dispositivos → Preferencias → Documentos personales).</p>
</details>

<div id="cam">
  <video id="vid" playsinline muted autoplay></video>
  <div class="frame"></div><div class="hint">Encuadrá la tapa y que se lea bien el título</div>
  <div class="camBar"><button class="ghost" id="cx">Cancelar</button><button id="snap">Sacar foto</button><button class="ghost" id="gal">Galería</button></div>
</div>

<script>
const $=id=>document.getElementById(id);
const store={get:k=>{try{return localStorage.getItem(k)||''}catch(e){return ''}},set:(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}}};
const SCRIPT_URL='https://script.google.com/macros/s/AKfycby9hkzd8jGMz4DYNJIiwvL0CH6eIebK6l7V--8CNEtJRZSDN-MlW0IyDjsTpp3q8ytlxw/exec';
$('mail').value=store.get('mail');
$('save').onclick=()=>{const m=$('mail').value.trim();if(!/^\S+@\S+\.\S+$/.test(m)){say('Ese mail no parece válido','err');return}store.set('mail',m);say('Mail guardado','ok');$('cfg').open=false};
if(!store.get('mail'))$('cfg').open=true;

function say(t,c){const s=$('status');s.textContent=t;s.className=c||'';s.style.display='block'}
const clean=s=>(s||'').replace(/<[^>]+>/g,'').trim();
const slug=s=>clean(s).replace(/[^\p{L}\p{N}]+/gu,'_').slice(0,60)||'libro';
const j=async u=>{const r=await fetch(u);if(!r.ok)throw new Error(r.status);return r.json()};
const norm=s=>(s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9 ]+/g,' ').replace(/\s+/g,' ').trim();
const STOP=new Set('de la el los las y del un una en con por a al lo e o'.split(' '));
const toks=q=>{const t=norm(q).split(' ').filter(Boolean);const k=t.filter(w=>!STOP.has(w)&&w.length>1);return k.length?k:t};
function variants(q){const t=toks(q),v=[q.trim()],n=norm(q);if(n&&n!==q.toLowerCase().trim())v.push(n);
  if(t.length>1)[...t].sort((a,b)=>b.length-a.length).slice(0,3).filter(w=>w.length>3).forEach(w=>v.push(w));return [...new Set(v)]}

async function iaEpub(id){
  const m=await j('https://archive.org/metadata/'+encodeURIComponent(id));
  const f=(m.files||[]).find(f=>/\.epub$/i.test(f.name));
  if(!f)throw new Error('Este título no tiene epub');
  return 'https://archive.org/download/'+encodeURIComponent(id)+'/'+f.name.split('/').map(encodeURIComponent).join('/');
}
const ORDER=['Project Gutenberg','Wikisource','Internet Archive','Open Library'];
const SOURCES=[
 {name:'Project Gutenberg',async run(q){
   const d=await j('https://gutendex.com/books/?languages=es&search='+encodeURIComponent(q));
   return d.results.filter(b=>b.formats['application/epub+zip']).map(b=>({title:b.title,author:(b.authors[0]||{}).name||'',url:async()=>b.formats['application/epub+zip'],inf:async()=>({author:b.authors.map(a=>a.name+(a.birth_year?` (${a.birth_year}–${a.death_year||''})`:'')).join('; '),desc:(b.summaries||[])[0]||''})}));}},
 {name:'Internet Archive',async run(q){
   const e=q.replace(/["():\[\]]/g,' ').trim();
   const p=new URLSearchParams({q:`(title:(${e}) OR creator:(${e})) AND language:(spa OR Spanish OR es) AND mediatype:texts AND format:EPUB AND (licenseurl:* OR date:[* TO 1930-12-31]) AND -collection:inlibrary AND -access-restricted-item:true`,rows:30,output:'json'});
   ['identifier','title','creator'].forEach(f=>p.append('fl[]',f));p.append('sort[]','downloads desc');
   const d=await j('https://archive.org/advancedsearch.php?'+p);
   return d.response.docs.map(b=>({title:b.title,author:[].concat(b.creator||[])[0]||'',url:()=>iaEpub(b.identifier),inf:()=>iaInfo(b.identifier)}));}},
 {name:'Open Library',async run(q){
   const p=new URLSearchParams({q:q+' ebook_access:public first_publish_year:[* TO 1930]',language:'spa',has_fulltext:'true',fields:'title,author_name,ia,key,first_publish_year',limit:20});
   const d=await j('https://openlibrary.org/search.json?'+p);
   return d.docs.filter(b=>b.ia&&b.ia.length).map(b=>({title:b.title,author:(b.author_name||[])[0]||'',url:()=>iaEpub(b.ia[0]),inf:async()=>({year:b.first_publish_year,desc:await olDesc(b.key)})}));}},
 {name:'Wikisource',async run(q){
   const d=await j('https://es.wikisource.org/w/api.php?action=query&list=search&format=json&origin=*&srlimit=15&srnamespace=0&srsearch='+encodeURIComponent(q));
   return d.query.search.map(b=>({title:b.title,author:'',url:async()=>'https://ws-export.wmcloud.org/?format=epub&lang=es&page='+encodeURIComponent(b.title),inf:async()=>{const d=await j('https://es.wikisource.org/w/api.php?action=query&prop=extracts&exintro=1&explaintext=1&exchars=500&format=json&origin=*&titles='+encodeURIComponent(b.title));return{desc:Object.values(d.query.pages)[0].extract||''}}}));}}
];

const txt=h=>new DOMParser().parseFromString(String(h||''),'text/html').body.textContent.replace(/\s+/g,' ').trim();
const cut=(s,n=600)=>s.length>n?s.slice(0,n).replace(/\s\S*$/,'')+'…':s;
async function iaInfo(id){const m=(await j('https://archive.org/metadata/'+encodeURIComponent(id))).metadata||{};
  return {author:txt([].concat(m.creator||[]).join('; ')),year:String(m.date||m.year||'').slice(0,4),desc:txt([].concat(m.description||[]).join(' '))}}
async function olDesc(key){if(!key)return '';const w=await j('https://openlibrary.org'+key+'.json');return txt(w.description&&typeof w.description==='object'?w.description.value:w.description)}
async function olLookup(title,author){const p=new URLSearchParams({title:title.split(/[:;(]/)[0],limit:1,fields:'key,first_publish_year'});if(author)p.set('author',author.split(',')[0]);
  const d=(await j('https://openlibrary.org/search.json?'+p)).docs[0];return d?{year:d.first_publish_year,desc:await olDesc(d.key)}:{}}
async function loadInfo(b){
  if(b.info)return b.info;
  const r={author:'',year:'',desc:''};
  for(const o of [...b.opts].sort((x,y)=>ORDER.indexOf(x.src)-ORDER.indexOf(y.src))){try{const i=await o.inf();['author','year','desc'].forEach(k=>{if(!r[k]&&i[k])r[k]=String(i[k])})}catch(e){}}
  if(!r.year||!r.desc){try{const i=await olLookup(b.title,b.author);if(!r.year&&i.year)r.year=String(i.year);if(!r.desc&&i.desc)r.desc=i.desc}catch(e){}}
  return b.info=r;
}
let all=[],qt=[],qa=[],qn='';
function score(b){
  const t=norm(b.title),a=norm(b.author);let s=0;
  qt.forEach(w=>{if(t.includes(w))s+=3;else if(a.includes(w))s+=2});
  s=s/(qt.length*3)*10;
  if(t===qn)s+=5;else if(t.startsWith(qn))s+=2.5;else if(t.includes(qn))s+=1.5;
  qa.forEach(w=>{if(a.includes(w))s+=1.5});
  return s-Math.min(t.length/200,1);
}
function add(src,list){list.forEach(b=>{if(!b.title)return;
  const k=norm(b.title.split(/[:;(]/)[0]),o={src,url:b.url,inf:b.inf},e=all.find(x=>x.k===k);
  if(e){if(!e.opts.some(p=>p.src===src))e.opts.push(o);if(!e.author&&b.author)e.author=b.author}
  else all.push({k,title:b.title,author:b.author||'',opts:[o]})})}
function card(b){
  const el=document.createElement('div');el.className='item';
  const top=document.createElement('div');top.className='top';
  const t=document.createElement('div');
  const h=document.createElement('b');h.textContent=b.title;
  const sm=document.createElement('small');sm.textContent=b.author;
  t.append(h,sm,document.createElement('br'));
  b.opts.forEach(o=>{const g=document.createElement('span');g.className='tag';g.textContent=o.src;t.append(g)});
  const btn=document.createElement('button');btn.textContent='Enviar';btn.onclick=()=>send(b,btn);
  top.append(t,btn);
  const dt=document.createElement('details');dt.className='det';
  const su=document.createElement('summary');su.textContent='Ver detalles';
  const body=document.createElement('div');dt.append(su,body);
  dt.addEventListener('toggle',async()=>{
    if(!dt.open||dt.dataset.l)return;dt.dataset.l=1;body.textContent='Cargando…';
    try{const i=await loadInfo(b);body.textContent='';
      [['Autor',i.author||b.author||'Sin datos'],['Año de publicación',i.year||'Sin datos'],['Sinopsis',cut(i.desc)||'Sin sinopsis disponible']].forEach(([k,v])=>{const p=document.createElement('p'),st=document.createElement('strong');st.textContent=k+': ';p.append(st,document.createTextNode(v));body.append(p)});
    }catch(e){body.textContent='No se pudieron cargar los detalles'}
  });
  el.append(top,dt);$('res').append(el);
}
function render(){
  all.forEach(b=>b.s=score(b));
  let l=all.filter(b=>b.s>0);if(!l.length)l=all;
  l.sort((a,b)=>b.s-a.s);$('res').textContent='';
  l.slice(0,40).forEach(card);return l.length;
}
async function search(author=''){
  const q=$('q').value.trim();if(!q)return;
  all=[];qa=author?toks(author):[];qt=toks(q);qn=norm(q);$('res').textContent='';say('Buscando…');let done=0;
  SOURCES.forEach(async s=>{
    const rs=await Promise.allSettled(variants(q).map(v=>s.run(v)));
    rs.forEach(r=>{if(r.status==='fulfilled')add(s.name,r.value)});
    const n=render();
    if(++done===SOURCES.length)say(n?`${n} resultados, los más parecidos primero`:'Sin resultados. Probá con otra grafía o solo con el apellido del autor.',n?'ok':'err');
    else say(`Buscando… (${n} hasta ahora)`);
  });
  const e=encodeURIComponent(q);
  $('ext').innerHTML=`También podés mirar: <a target="_blank" rel="noopener" href="https://www.cervantesvirtual.com/buscador/?q=${e}">Cervantes Virtual</a><a target="_blank" rel="noopener" href="https://bibliotecadigital.bne.es/bdh/es/results/index.do?text=${e}">Biblioteca Digital Hispánica</a><a target="_blank" rel="noopener" href="https://www.educ.ar/recursos/buscar?q=${e}">Educ.ar</a>`;
}
async function send(b,btn){
  const to=store.get('mail');
  if(!to){$('cfg').open=true;say('Primero guardá tu mail','err');return}
  btn.disabled=true;let err='';
  for(const o of [...b.opts].sort((x,y)=>ORDER.indexOf(x.src)-ORDER.indexOf(y.src))){
    try{
      say(`Enviando “${b.title}” desde ${o.src}…`);
      const file=await o.url();
      const r=await fetch(SCRIPT_URL,{method:'POST',headers:{'Content-Type':'text/plain'},body:JSON.stringify({to,url:file,title:b.title,filename:slug(b.title)+'.epub'})});
      const d=await r.json();
      if(d.ok){say('Enviado a '+to+' ('+o.src+')','ok');btn.disabled=false;return}
      err=d.error;if(/límite/i.test(err))break;
    }catch(e){err=e.message}
  }
  say('No se pudo enviar: '+err,'err');btn.disabled=false;
}
$('go').onclick=()=>search();
$('q').addEventListener('keydown',e=>{if(e.key==='Enter')search()});

// ---- Tapa: cámara + reconocimiento con IA (vía tu script) ----
function shrink(src){
  const w0=src.videoWidth||src.naturalWidth||src.width,h0=src.videoHeight||src.naturalHeight||src.height,k=Math.min(1,1024/Math.max(w0,h0));
  const c=document.createElement('canvas');c.width=Math.round(w0*k);c.height=Math.round(h0*k);
  c.getContext('2d').drawImage(src,0,0,c.width,c.height);
  return c.toDataURL('image/jpeg',.8).split(',')[1];
}
async function readCover(el){
  say('Reconociendo el libro…');
  try{
    const r=await fetch(SCRIPT_URL,{method:'POST',headers:{'Content-Type':'text/plain'},body:JSON.stringify({action:'identify',image:shrink(el)})});
    const d=await r.json();
    if(!d.ok)throw new Error(d.error);
    if(!d.title){say('No pude reconocer el libro. Probá con la tapa completa y buena luz, o escribí el título.','err');return}
    $('q').value=d.title;search(d.author||'');
    say(`Reconocí: “${d.title}”${d.author?' de '+d.author:''}${d.confidence==='baja'?' (no estoy seguro)':''}. Buscando…`,'ok');
  }catch(e){say('No se pudo reconocer: '+e.message,'err')}
}
let stream;
async function openCam(){
  try{
    stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'},width:{ideal:1920}},audio:false});
    $('vid').srcObject=stream;$('cam').style.display='flex';
  }catch(e){say('No pude abrir la cámara (¿diste permiso?). Elegí una foto de la galería.','err');$('file').click()}
}
function closeCam(){if(stream)stream.getTracks().forEach(t=>t.stop());stream=null;$('cam').style.display='none'}
$('scan').onclick=openCam;
$('cx').onclick=closeCam;
$('gal').onclick=()=>{closeCam();$('file').click()};
$('gal0').onclick=()=>$('file').click();
$('snap').onclick=()=>{
  const v=$('vid');if(!v.videoWidth)return;
  const f=document.createElement('canvas');f.width=v.videoWidth;f.height=v.videoHeight;f.getContext('2d').drawImage(v,0,0);
  closeCam();readCover(f);
};
$('file').onchange=e=>{
  const f=e.target.files[0];if(!f)return;
  const img=new Image();img.onload=()=>readCover(img);img.src=URL.createObjectURL(f);e.target.value='';
};
</script>
</body>
</html>
